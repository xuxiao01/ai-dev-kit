<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex 资源观察台</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #162033;
        --muted: #667085;
        --line: #e4e7ec;
        --paper: #ffffff;
        --canvas: #f6f8fb;
        --blue: #2563eb;
        --blue-soft: #eff6ff;
        --green: #15803d;
        --green-soft: #f0fdf4;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        color: var(--ink);
        background: var(--canvas);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      header {
        padding: 28px clamp(20px, 5vw, 72px);
        color: #fff;
        background: linear-gradient(120deg, #172554, #1d4ed8);
      }
      h1 { margin: 0; font-size: clamp(24px, 4vw, 36px); letter-spacing: -.03em; }
      header p { max-width: 680px; margin: 8px 0 0; color: #dbeafe; }

      main { max-width: 1280px; margin: 0 auto; padding: 24px clamp(16px, 3vw, 36px) 48px; }
      .summary { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
      .counts { display: flex; gap: 10px; flex-wrap: wrap; }
      .pill { padding: 5px 10px; border-radius: 999px; color: var(--blue); background: var(--blue-soft); font-size: 13px; font-weight: 650; }
      .pill.rule { color: var(--green); background: var(--green-soft); }
      .search {
        width: min(320px, 100%); padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px;
        outline: none; background: var(--paper); font: inherit;
      }
      .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe; }

      .layout { display: grid; grid-template-columns: minmax(260px, .86fr) minmax(0, 1.5fr); gap: 20px; }
      .panel { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: 0 1px 2px #1018280d; }
      .panel-title { display: flex; justify-content: space-between; align-items: center; margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 14px; }
      .resource-list { padding: 8px; }
      .resource {
        display: block; width: 100%; margin: 0; padding: 11px 10px; border: 0; border-radius: 8px; color: inherit;
        background: transparent; text-align: left; cursor: pointer; font: inherit;
      }
      .resource:hover, .resource.active { background: var(--blue-soft); }
      .resource-name { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
      .resource-path { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      .tag { flex: none; padding: 1px 6px; border-radius: 4px; color: var(--green); background: var(--green-soft); font-size: 11px; font-weight: 700; }
      .tag.skill { color: var(--blue); background: var(--blue-soft); }
      .empty { padding: 28px 16px; color: var(--muted); text-align: center; }

      .detail { padding: 20px; }
      .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      h2 { margin: 0; font-size: 22px; }
      .description { margin: 8px 0 18px; color: var(--muted); }
      .meta { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px 12px; margin: 0 0 18px; font-size: 13px; }
      dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
      .source {
        min-height: 260px; max-height: 58vh; margin: 0; padding: 16px; overflow: auto; border-radius: 8px;
        color: #d0d5dd; background: #101828; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre-wrap;
      }
      .source.loading { color: #98a2b3; }
      .open { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--blue); text-decoration: none; font-size: 13px; white-space: nowrap; }
      .open:hover { border-color: var(--blue); background: var(--blue-soft); }
      .hint { margin: 12px 0 0; color: var(--muted); font-size: 12px; }

      @media (max-width: 760px) {
        .summary { align-items: stretch; flex-direction: column; }
        .search { width: 100%; }
        .layout { grid-template-columns: 1fr; }
        .source { max-height: 42vh; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Codex 资源观察台</h1>
      <p>浏览通用 Skills 与可选投资平台套装；选择资源即可阅读当前 Markdown 源文件。</p>
    </header>

    <main>
      <div class="summary">
        <div class="counts" id="counts"></div>
        <input class="search" id="search" type="search" placeholder="搜索名称、说明或路径…" aria-label="搜索 Codex 资源" />
      </div>

      <p>通用资源使用 <code>codex add --all</code>；投资平台套装显式使用 <code>codex add --multi-agent-investment</code>，包含 git-commit、docs、staged-change-report、project-ui-style、project-verification，前两份复用通用资源。</p>
      <section class="layout" aria-label="Codex 资源列表与详情">
        <aside class="panel">
          <h2 class="panel-title">资源列表 <span id="result-count"></span></h2>
          <div class="resource-list" id="resource-list"></div>
        </aside>
        <article class="panel">
          <div class="detail" id="detail"></div>
        </article>
      </section>
    </main>

    <script>
      const resources = [
        {
          type: 'skill', name: 'vue-config', path: 'skills/vue-config/SKILL.md',
          description: 'Vue 组件参数、配置对象与 CSS 变量的组织约定。'
        },
        {
          type: 'skill', name: 'bug-review', path: 'skills/bug-review/SKILL.md',
          description: '基于对话、代码和错误证据生成工程问题复盘。'
        },
        {
          type: 'skill', name: 'git-commit', path: 'skills/git-commit/SKILL.md',
          description: '分析暂存区并创建一条安全的中文 Conventional Commit。'
        },
        {
          type: 'skill', name: 'git-submit', path: 'skills/git-submit/SKILL.md',
          description: '核对个人分支，暂存工作区并提交，同步主干后推送，供用户提交 PR。'
        },
        {
          type: 'skill', name: 'readme', path: 'skills/readme/SKILL.md',
          description: '基于真实项目结构和配置生成或更新 README。'
        },
        {
          type: 'skill', name: 'blog', path: 'skills/blog/SKILL.md',
          description: '优化中文技术博客，配套安装 draw，优先使用本机 draw.io 配图，缺少软件时参考同一规范用 AI 生图。'
        },
        {
          type: 'skill', name: 'docs', path: 'skills/docs/SKILL.md',
          description: '创建、归档与维护项目文档及其索引和敏感边界。'
        },
        {
          type: 'skill', name: 'draw', path: 'skills/draw/SKILL.md',
          description: '为论文、答辩 PPT 和技术文章制作可编辑的网络图、架构图与时序图。'
        }
      ];

      const packResources = [
        {
          type: 'skill', name: 'staged-change-report', path: 'packs/multi-agent-investment/skills/staged-change-report/SKILL.md',
          description: '投资平台可选套装：暂存区修改报告'
        },
        {
          type: 'skill', name: 'project-ui-style', path: 'packs/multi-agent-investment/skills/project-ui-style/SKILL.md',
          description: '投资平台可选套装：投资平台 UI 风格'
        },
        {
          type: 'skill', name: 'project-verification', path: 'packs/multi-agent-investment/skills/project-verification/SKILL.md',
          description: '投资平台可选套装：投资平台验证与本地验收'
        }
      ];
      const genericSkillCount = resources.length;
      resources.push(...packResources);

      const list = document.querySelector('#resource-list');
      const detail = document.querySelector('#detail');
      const search = document.querySelector('#search');
      const resultCount = document.querySelector('#result-count');
      const counts = document.querySelector('#counts');
      let selected = resources[0];

      function escapeHtml(value) {
        return value.replace(/[&<>'"]/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' })[character]);
      }

      function renderCounts() {
        counts.innerHTML = `<span class="pill">${genericSkillCount} 通用 skills</span><span class="pill">1 可选套装（5 成员）</span>`;
      }

      function filteredResources() {
        const query = search.value.trim().toLowerCase();
        return resources.filter((resource) => !query || `${resource.name} ${resource.path} ${resource.description}`.toLowerCase().includes(query));
      }

      function renderList() {
        const visible = filteredResources();
        resultCount.textContent = `${visible.length} 项`;
        if (!visible.length) {
          list.innerHTML = '<p class="empty">没有匹配的资源</p>';
          return;
        }
        list.innerHTML = visible.map((resource) => `
          <button class="resource ${resource === selected ? 'active' : ''}" data-name="${resource.name}">
            <span class="resource-name"><span>${resource.name}</span><span class="tag ${resource.type}">${resource.type}</span></span>
            <span class="resource-path">${resource.path}</span>
          </button>
        `).join('');
        list.querySelectorAll('.resource').forEach((button) => button.addEventListener('click', () => {
          selected = resources.find((resource) => resource.name === button.dataset.name);
          renderList();
          renderDetail();
        }));
      }

      async function renderDetail() {
        detail.innerHTML = `
          <div class="detail-top"><div><h2>${selected.name}</h2><p class="description">${selected.description}</p></div><a class="open" href="${selected.path}" target="_blank" rel="noopener">打开文件 ↗</a></div>
          <dl class="meta"><dt>类型</dt><dd>${selected.type}</dd><dt>相对路径</dt><dd>${selected.path}</dd></dl>
          <pre class="source loading">正在读取源文件…</pre>
          <p class="hint">提示：请从仓库根目录运行 <code>python3 -m http.server 8000</code>，再打开 <code>http://localhost:8000/codex/</code>。</p>
        `;
        const source = detail.querySelector('.source');
        try {
          const response = await fetch(selected.path, { cache: 'no-store' });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          source.classList.remove('loading');
          source.innerHTML = escapeHtml(await response.text());
        } catch (error) {
          source.classList.remove('loading');
          source.textContent = `无法读取 ${selected.path}\n\n请使用本地 HTTP 服务打开本页面，或点击“打开文件”。\n${error.message}`;
        }
      }

      search.addEventListener('input', renderList);
      renderCounts();
      renderList();
      renderDetail();
    </script>
  </body>
</html>
